services:
  autolyrics:
    build: .
    container_name: autolyrics
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Passwort für die Steuerung. Leer = keine Anmeldung (wie bisher).
      - AUTOLYRICS_PASSWORD=${AUTOLYRICS_PASSWORD:-}
    volumes:
      - ./data:/data
