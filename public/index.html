<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Autolyrics</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="root"></div>
<script>
(function() {
  function checkCapabilities() {
    // URL override: ?legacy=1 or ?modern=1
    if (window.location.search.indexOf('legacy=1') !== -1) return false;
    if (window.location.search.indexOf('modern=1') !== -1) return true;

    // Check basic prerequisites
    if (!window.WebSocket) return false;
    if (!window.JSON || !JSON.parse || !JSON.stringify) return false;
    if (!document.querySelector || !document.addEventListener) return false;
    if (!Array.prototype.forEach || !Array.prototype.map || !Array.prototype.filter) return false;

    // Detect older iOS devices (Safari, Chrome/CriOS, Firefox/FxiOS on iOS < 15)
    var ua = navigator.userAgent || '';
    var iosMatch = ua.match(/(?:iPad|iPhone|iPod).*?OS\s+(\d+)[._](\d+)/i);
    if (!iosMatch && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
      var safariMatch = ua.match(/Version\/(\d+)[._](\d+)/i);
      if (safariMatch) iosMatch = safariMatch;
    }
    if (iosMatch) {
      var major = parseInt(iosMatch[1], 10);
      if (major < 15) return false;
    }

    // Check modern ECMAScript capabilities required by React 18 & esbuild bundle
    // (ES6 classes, arrow functions, spread, template literals, const/let, default params,
    // optional chaining ?., nullish coalescing ??, logical assignment ||=, async/await)
    try {
      new Function('class _T {}; const fn = async (a = 1, ...rest) => { var o = { b: 2 }; var c = 0; c ||= 1; return o?.b === 2 && (null ?? a) === 1 && c === 1; }; return fn();')();
    } catch (e) {
      return false;
    }

    // Check modern APIs required by the bundle
    try {
      if (typeof Promise === 'undefined' || typeof fetch === 'undefined') return false;
      if (typeof Object.assign !== 'function' || typeof Symbol === 'undefined') return false;
      if (typeof queueMicrotask !== 'function') return false;
      if (typeof AbortController === 'undefined') return false;
    } catch (e) {
      return false;
    }

    return true;
  }

  var isSupported = checkCapabilities();
  var script = document.createElement('script');
  if (isSupported) {
    script.src = '/bundle.js';

    // Fallback if bundle.js fails to load or execute on older engine
    var fallbackTriggered = false;
    function triggerLegacyFallback() {
      if (fallbackTriggered) return;
      fallbackTriggered = true;
      if (!window.__autolyrics_loaded && window.location.search.indexOf('modern=1') === -1) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          console.warn('Autolyrics bundle failed to initialize, falling back to legacy client.');
          var fallbackScript = document.createElement('script');
          fallbackScript.src = '/legacy.js';
          document.body.appendChild(fallbackScript);
        }
      }
    }

    script.onerror = triggerLegacyFallback;
    window.addEventListener('error', function(e) {
      if (!window.__autolyrics_loaded) {
        triggerLegacyFallback();
      }
    });
  } else {
    // Load simple, lightweight legacy script for older browsers (e.g. old iPad / Safari / Chrome on iOS)
    script.src = '/legacy.js';
  }
  document.body.appendChild(script);
})();
</script>
</body>
</html>
