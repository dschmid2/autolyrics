<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0A0A0D"/>
  <!-- Lyrics lines -->
  <line x1="100" y1="160" x2="412" y2="160" stroke="#F4EFE4" stroke-width="28" stroke-linecap="round" />
  <line x1="100" y1="240" x2="300" y2="240" stroke="#9AA0AE" stroke-width="20" stroke-linecap="round" />
  <!-- Music note -->
  <g transform="translate(120, 110)">
    <!-- Note Head -->
    <circle cx="100" cy="220" r="40" fill="#D89A3E" />
    <!-- Stem -->
    <path d="M140 220 L140 80" stroke="#D89A3E" stroke-width="16" stroke-linecap="round" />
    <!-- Flag -->
    <path d="M140 88 C170 95 200 120 200 160" fill="none" stroke="#D89A3E" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
