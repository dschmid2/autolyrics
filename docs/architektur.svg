<path class="ln" d="M50.5 382 H22 V110 H36" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="lbl" x="28" y="240">LAN</text>

<line class="ln" x1="40" y1="444" x2="80" y2="444"/>
<text class="lbl" x="88" y="448">Kabel (LAN / HDMI)</text>
<line class="ln wl" x1="240" y1="444" x2="280" y2="444"/>
<text class="lbl" x="288" y="448">WLAN</text>
<rect class="sw-teal" x="360" y="436" width="14" height="14" rx="3" stroke-width="0.75"/>
<text class="lbl" x="380" y="448">Server / Steuerung</text>
<rect class="sw-purple" x="510" y="436" width="14" height="14" rx="3" stroke-width="0.75"/>
<text class="lbl" x="530" y="448">Ausgabe-Clients</text>
</svg>
