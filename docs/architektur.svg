</g>
<g class="purple">
<rect x="193" y="260" width="140" height="56" rx="8" stroke-width="0.75"/>
<text class="t" x="263" y="283" text-anchor="middle">Stage Solo</text>
<text class="s" x="263" y="302" text-anchor="middle">Pi OS Lite · Chrome</text>
</g>
<g class="purple">
<rect x="346" y="260" width="140" height="56" rx="8" stroke-width="0.75"/>
<text class="t" x="416" y="283" text-anchor="middle">Stage Chor</text>
<text class="s" x="416" y="302" text-anchor="middle">Pi OS Lite · Chrome</text>
</g>
<g class="teal">
<rect x="499" y="260" width="140" height="56" rx="8" stroke-width="0.75"/>
<text class="t" x="569" y="283" text-anchor="middle">Steuerung</text>
<text class="s" x="569" y="302" text-anchor="middle">Laptop / iPad</text>
</g>

<line class="ln" x1="110" y1="318" x2="110" y2="356" marker-end="url(#arrow)"/>
<line class="ln" x1="263" y1="318" x2="263" y2="356" marker-end="url(#arrow)"/>
<line class="ln" x1="416" y1="318" x2="416" y2="356" marker-end="url(#arrow)"/>
<text class="lbl" x="120" y="341">HDMI</text>
<text class="lbl" x="273" y="341">HDMI</text>
<text class="lbl" x="426" y="341">HDMI</text>

<g class="gray">
<rect x="52.5" y="360" width="115" height="44" rx="8" stroke-width="0.75"/>
<text class="t" x="110" y="387" text-anchor="middle">Beamer</text>
</g>
<g class="gray">
<rect x="205.5" y="360" width="115" height="44" rx="8" stroke-width="0.75"/>
<text class="t" x="263" y="387" text-anchor="middle">Bildschirm</text>
</g>
<g class="gray">
<rect x="358.5" y="360" width="115" height="44" rx="8" stroke-width="0.75"/>
