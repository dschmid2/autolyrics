<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Einsatz-Setup der Lyrics-Projektion</title>
<desc>Der Server-Pi läuft mit DietPi und Docker, darin autolyrics und Portainer. Er ist per LAN mit dem WLAN-Router verbunden, ebenso der Beamer. Per WLAN hängen der Live-Player, die Stage-Player für Solo und Chor (alle mit Raspberry Pi OS Lite und Chrome) sowie die Steuerung per Laptop oder iPad am Router. Die Player geben per HDMI auf Beamer und Bildschirme aus.</desc>
<style>
.bg{fill:#ffffff}
.t{font-size:14px;font-weight:600}
.s{font-size:12px}
.lbl{font-size:12px;fill:#5F5E5A}
.ln{stroke:#73726C;stroke-width:1.5;fill:none}
.wl{stroke-dasharray:5 4}
.mk{stroke:#73726C;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.box rect{fill:#ffffff;stroke:#B4B2A9}.box .t{fill:#2C2C2A}
.sw-teal{fill:#E1F5EE;stroke:#0F6E56}.sw-purple{fill:#EEEDFE;stroke:#534AB7}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.lbl{fill:#B4B2A9}
.ln,.mk{stroke:#9C9A92}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#9FE1CB}.teal .s{fill:#5DCAA5}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#CECBF6}.purple .s{fill:#AFA9EC}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t{fill:#D3D1C7}.gray .s{fill:#B4B2A9}
.box rect{fill:#2C2C2A;stroke:#5F5E5A}.box .t{fill:#D3D1C7}
.sw-teal{fill:#085041;stroke:#5DCAA5}.sw-purple{fill:#3C3489;stroke:#AFA9EC}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="470" rx="12"/>

<g class="gray">
<rect x="40" y="82" width="200" height="56" rx="8" stroke-width="0.75"/>
<text class="t" x="140" y="105" text-anchor="middle">WLAN-Router</text>
<text class="s" x="140" y="124" text-anchor="middle">Netzwerkzentrale</text>
</g>
<text class="lbl" x="310" y="100" text-anchor="middle">LAN</text>
<line class="ln" x1="242" y1="110" x2="376" y2="110" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g class="teal">
<rect x="380" y="24" width="260" height="172" rx="12" stroke-width="0.75"/>
<text class="t" x="510" y="47" text-anchor="middle">Server-Pi</text>
<text class="s" x="510" y="66" text-anchor="middle">Raspberry Pi · DietPi</text>
</g>
<g class="box">
<rect x="394" y="78" width="232" height="106" rx="10" stroke-width="0.75"/>
<text class="t" x="510" y="99" text-anchor="middle">Docker</text>
</g>
<g class="gray">
<rect x="406" y="108" width="100" height="64" rx="8" stroke-width="0.75"/>
<text class="t" x="456" y="134" text-anchor="middle">autolyrics</text>
<text class="s" x="456" y="153" text-anchor="middle">Lyrics-Server</text>
</g>
<g class="gray">
<rect x="514" y="108" width="100" height="64" rx="8" stroke-width="0.75"/>
<text class="t" x="564" y="134" text-anchor="middle">Portainer</text>
<text class="s" x="564" y="153" text-anchor="middle">Verwaltung</text>
</g>

<path class="ln wl" d="M140 140 V215"/>
<path class="ln wl" d="M110 215 H569"/>
<line class="ln wl" x1="110" y1="215" x2="110" y2="256" marker-end="url(#arrow)"/>
<line class="ln wl" x1="263" y1="215" x2="263" y2="256" marker-end="url(#arrow)"/>
<line class="ln wl" x1="416" y1="215" x2="416" y2="256" marker-end="url(#arrow)"/>
<line class="ln wl" x1="569" y1="215" x2="569" y2="256" marker-end="url(#arrow)"/>
<text class="lbl" x="584" y="219">WLAN</text>

<g class="purple">
<rect x="40" y="260" width="140" height="56" rx="8" stroke-width="0.75"/>
